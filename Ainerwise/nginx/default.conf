server {
    listen 80;
    server_name cebu.localhost cebu.local;
    return 301 http://procurement.localhost$request_uri;
}

server {
    listen 80;
    server_name cebu-h5.localhost cebu-h5.local;
    return 301 http://procurement-h5.localhost$request_uri;
}

server {
    listen 80;
    server_name cebu-admin.localhost cebu-admin.local;
    return 301 http://procurement-admin.localhost$request_uri;
}
