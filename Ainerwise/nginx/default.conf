upstream frontend_pc {
    server frontend-pc:4099;
}

upstream frontend_h5 {
    server frontend-h5:4098;
}

upstream frontend_admin {
    server frontend-admin:4097;
}

upstream backend {
    server backend:8000;
}

upstream channel_gateway {
    server channel-gateway:8200;
}

resolver 127.0.0.11 valid=10s ipv6=off;

# ===== PC端 — 公开官网 (port 80) =====
server {
    listen 80 default_server;
    server_name localhost;
    client_max_body_size 100M;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Trusted Portal Context: always overwrite any client-supplied
        # X-Portal-Key so external requests can never forge the portal.
        proxy_set_header X-Portal-Key "aislos";
    }

    location /webhooks/ {
        set $channel_gateway_upstream channel-gateway:8200;
        proxy_pass http://$channel_gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_pc_upstream frontend-pc:4099;
        proxy_pass http://$frontend_pc_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ===== AinerWise Procurement PC (standalone portal) =====
server {
    listen 80;
    server_name procurement.localhost;
    client_max_body_size 100M;

    location = /api/auth/system-mode {
        set $backend_upstream backend:8000;
        rewrite ^ /api/v1/cebu-compat/system-mode break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portal-Key "cebu";
    }

    location /api/auth/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/auth/(.*)$ /api/v1/auth/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portal-Key "cebu";
