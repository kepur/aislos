        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Portal-Key "admin_cebu";
    }

    location /api/admin/kyc-media {
        set $backend_upstream backend:8000;
        rewrite ^/api/admin/kyc-media(.*)$ /api/v1/cebu-compat/admin/kyc-media$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Portal-Key "admin_cebu";
    }

    location ~ ^/api/admin/(dashboard|marketplace|orders|users|staff|companies|settings|audit-logs|notification-templates|notifications|backups)(/.*)?$ {
        set $backend_upstream backend:8000;
        rewrite ^/api/admin/(.*)$ /api/v1/cebu-compat/admin/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portal-Key "admin_cebu";
    }

    location /api/admin/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/admin/(.*)$ /api/v1/admin/cebu/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portal-Key "admin_cebu";
    }

    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*)$ /api/v1/cebu-compat/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portal-Key "admin_cebu";
    }

    location / {
        set $procurement_admin_upstream host.docker.internal:4108;
        proxy_pass http://$procurement_admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

