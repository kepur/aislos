        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portal-Key "cebu";
    }

    location /api/wallets/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/wallets/(.*)$ /api/v1/cebu-trade/wallet/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portal-Key "cebu";
    }

    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*)$ /api/v1/cebu-compat/$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Portal-Key "cebu";
    }

    location / {
        set $procurement_pc_upstream host.docker.internal:4106;
        proxy_pass http://$procurement_pc_upstream;
        proxy_set_header Host $host;
