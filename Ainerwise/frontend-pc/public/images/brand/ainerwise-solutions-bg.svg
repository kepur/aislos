      <circle cx="40" cy="39" r="7" fill="#fbbf24"/>
      <text x="66" y="47" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ecfdf5">Integration</text>
    </g>
    <g transform="translate(1502 846)">
