<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="AinerWise premium solution architecture background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".42" stop-color="#061711"/>
      <stop offset="1" stop-color="#031b24"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff" stop-opacity=".66"/>
      <stop offset=".45" stop-color="#34d399" stop-opacity=".18"/>
      <stop offset="1" stop-color="#020617" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="glassB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".15"/>
      <stop offset="1" stop-color="#020617" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a7f3d0" stop-opacity=".88"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ecfdf5" stop-opacity=".98"/>
      <stop offset=".28" stop-color="#22c55e" stop-opacity=".78"/>
      <stop offset=".66" stop-color="#14b8a6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#d1fae5" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity=".86"/>

  <g opacity=".52">
    <circle cx="1508" cy="138" r="430" fill="#10b981" opacity=".10"/>
